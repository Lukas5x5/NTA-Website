  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tById(id);\nconst clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));\nconst lerp=(a,b,t)=>a+(b-a)*t;\nconst E={\n  outCubic:t=>1-Math.pow(1-t,3), inCubic:t=>t*t*t,\n  inOutCubic:t=> t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,\n  outQuint:t=>1-Math.pow(1-t,5),\n  outBack:(t,s=1.7)=>{const c=s+1;return 1+c*Math.pow(t-1,3)+s*Math.pow(t-1,2);},\n  outElastic:t=>{if(t===0)return 0;if(t===1)return 1;const c=(2*Math.PI)/3;return Math.pow(2,-10*t)*Math.sin((t*10-0.75)*c)+1;},\n  outBounce:t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375;}\n};\nconst seg=(t,a,b,ease=(x)=>x)=>ease(clamp((t-a)/(b-a)));\nconst tw=(t,a,b,v0,v1,ease=E.outCubic)=>lerp(v0,v1,seg(t,a,b,ease));\nconst setO=(el,o)=>{el.style.opacity=o;};\n\nconst stage=$('stage');\n/* scene 1 */\nconst trkPath=$('trkPath'), balloon1=$('balloon1'), landpin=$('landpin'),\n      completeChip=$('completeChip'), hw1=$('hw1'), s1=$('s1');\nconst trkLen=trkPath.getTotalLength();\ntrkPath.style.strokeDasharray=trkLen; trkPath.style.strokeDashoffset=trkLen;\nconst LAND={x:600,y:1180};\nlandpin.style.left=(LAND.x-40)+'px'; landpin.style.top=(LAND.y-72)+'px';\n\n/* scene 2/3 cards */\nconst flightCard=$('flightCard'), logCard=$('logCard'), beam=$('beam'), syncBadge=$('syncBadge');\n\n/* logbook rows built in JS so values can reveal one by one */\nconst LOG=[\n  ['Date','09 JUN 2026'],['From','Neumarkt a.d. Ybbs'],['Off block','06:42'],\n  ['To','Wolfpassing'],['On block','08:04'],['Block time','01:22'],\n  ['PIC','M. Berger'],['Aircraft','OE-ZNT'],['Day / Night','Day']\n];\nconst logRowsEl=$('logRows');\nconst rowRefs=LOG.map(([l,v])=>{\n  const row=document.createElement('div'); row.className='lrow';\n  row.innerHTML=`<span class=\"ll\">${l}<\u002Fspan><span class=\"lv\"><span class=\"ph\">—<\u002Fspan><span class=\"rl\">${v}<\u002Fspan><span class=\"hl\"><\u002Fspan><\u002Fspan>`;\n  logRowsEl.appendChild(row);\n  return {ph:row.query bic)));\n  hw1.style.transform=`scale(${tw(t,0.7,1.1,1.4,1,E.outBack)}) translateY(${seg(t,4.3,4.7,E.inCubic)*-40}px)`;\n\n  /* ---------- SCENE 2: flight card (2.7–10.4) ---------- */\n  const fcIn=seg(t,4.5,5.05,E.outBack);\n  const fcOut=t>12.0?seg(t,12.0,12.5,E.inCubic):0;\n  setO(flightCard, seg(t,4.5,4.8)*(1-fcOut));\n  flightCard.style.transform=`translateY(${lerp(70,0,fcIn)+fcOut*-50}px) scale(${1-fcOut*0.04})`;\n\n  /* ---------- SCENE 3: logbook + beam (4.6–10.4) ---------- */\n  const lcIn=seg(t,6.4,6.95,E.outBack);\n  const lcOut=t>12.0?seg(t,12.0,12.5,E.inCubic):0;\n  setO(logCard, seg(t,6.4,6.7)*(1-lcOut));\n  logCard.style.transform=`translateY(${lerp(80,0,lcIn)+lcOut*50}px) scale(${1-lcOut*0.04})`;\n\n  // beam packets flow 4.7 -> 8.4\n  const beamActive = t>6.5 && t<10.2;\n  pkts.forEach((p,i)=>{\n    if(!beamActive){setO(p,0);return;}\n    const ph=((t-6.5)*0.62 + i/pkts.length)%1;\n    const y=lerp(PKT_FROM.y,PKT_TO.y,ph);\n    const x=PKT_FROM.x + Math.sin(ph*Math.PI*2+i)*26;\n    p.style.transform=`translate(${x-8}px,${y-8}px)`;\n    setO(p, Math.sin(ph*Math.PI)*0.9);\n  });\n\n  // logbook rows reveal one by one (5.0 .. 8.0)\n  const REV0=6.8, STEP=0.33;\n  rowRefs.forEach((r,i)=>{\n    const a=REV0+i*STEP;\n    const rv=seg(t,a,a+0.32,E.outCubic);\n    setO(r.rl, rv);\n    r.rl.style.transform=`translateY(${lerp(10,0,rv)}px)`;\n    setO(r.ph, 1-rv);\n    // green highlight flash on arrival\n    const fl=seg(t,a,a+0.18)*(1-seg(t,a+0.18,a+0.6));\n    setO(r.hl, fl*0.9);\n    if(t<a-0.05 || t>12.4){ /* keep states sane outside */ }\n  });\n  // reset reveal when loop restarts (t<4.9) so it re-animates\n  if(t<6.7){ rowRefs.forEach(r=>{setO(r.rl,0);setO(r.ph,1);setO(r.hl,0);}); }\n\n  // sync badge pops after fields filled (8.1)\n  const sbIn=seg(t,9.9,10.45,E.outElastic);\n  const sbOut=t>12.0?seg(t,12.0,12.4,E.inCubic):0;\n  setO(syncBadge, clamp(seg(t,9.9,10.15),0,1)*(1-sbOut));\n  syncBadge.style.transform=`translateX(-50%) scale(${lerp(0.5,1,clamp(sbIn,0,1.12))-sbOut*0.15})`;\n\n  /* ---------- SCENE 4: claim (10.4–15.2, long hold to read) ---------- */\n  const clKickIn=seg(t,12.3,12.65,E.outCubic);\n  const clOut=t>17.0?seg(t,17.0,17.4,E.inCubic):0;\n  setO(clKick, seg(t,12.3,12.6)*(1-clOut));\n  clKick.style.transform=`translateY(${lerp(-16,0,clKickIn)}px)`;\n  const beats=[12.6,12.95,13.3];\n  cl.forEach((el,i)=>{\n    const b=beats[i], inP=seg(t,b,b+0.42,E.outBack);\n    setO(el, inP*(1-clOut));\n    el.style.transform=`translateY(${lerp(40,0,inP)+clOut*-30}px) scale(${lerp(1.12,1,inP)})`;\n  });\n  const subIn=seg(t,13.7,14.15,E.outCubic);\n  setO(clSub, subIn*(1-clOut));\n  clSub.style.transform=`translateY(${lerp(26,0,subIn)}px)`;\n\n  /* ---------- SCENE 5: lockup (15.3–19) ---------- */\n  const luOn=seg(t,17.1,17.45);\n  setO(lockup, luOn);\n  const ntaIn=seg(t,17.2,17.75,E.outBack);\n  setO(lkNta, seg(t,17.2,17.45));\n  lkNta.style.transform=`translateY(${lerp(50,0,ntaIn)}px) scale(${lerp(0.8,1,ntaIn)})`;\n  const xIn=seg(t,17.6,18.0,E.outBack);\n  setO(lkX, seg(t,17.6,17.8));\n  lkX.style.transform=`scale(${lerp(0.2,1,xIn)}) rotate(${lerp(-40,0,xIn)}deg)`;\n  const capzIn=seg(t,17.8,18.35,E.outBack);\n  setO(lkCapz, seg(t,17.8,18.05));\n  lkCapz.style.transform=`translateY(${lerp(50,0,capzIn)}px) scale(${lerp(0.8,1,capzIn)})`;\n  const liveIn=seg(t,18.45,18.85,E.outCubic);\n  setO(lkLive, seg(t,18.45,18.7));\n  lkLive.style.transform=`translateY(${lerp(34,0,liveIn)}px)`;\n  [[bApple,18.95],[bGoogle,19.1]].forEach(([b,bs])=>{const bin=seg(t,bs,bs+0.45,E.outBack);setO(b,seg(t,bs,bs+0.2));b.style.transform=`translateY(${lerp(150,0,bin)}px)`;});\n\n  /* scene dots */\n  const bounds=[0,4.5,6.4,12.2,17.1,24.0];\n  for(let i=0;i<5;i++){dots[i].style.width=(clamp((t-bounds[i])/(bounds[i+1]-bounds[i]),0,1)*100)+'%';}\n}\n\n/* ===================== CLOCK ===================== */\nlet startTime=null,_lastScale=-1,_acc=0,_lastNow=null;\nconst _q=new URLSearchParams(location.search);\nconst _fv=parseFloat(_q.get('frz')); const _freeze=Number.isFinite(_fv)?_fv:null;\nlet speed=1.1;\nfunction frame(now){\n  if(_lastScale<=0)fit();\n  if(_freeze!==null){render(_freeze);requestAnimationFrame(frame);return;}\n  if(_lastNow===null)_lastNow=now;\n  _acc=(_acc + (now-_lastNow)/1000*speed); _lastNow=now;\n  const t=_acc%DUR;\n  render(t);\n  requestAnimationFrame(frame);\n}\nrequestAnimationFrame(frame);\n\n/* scaler */\nfunction fit(){const w=window.innerWidth,h=window.innerHeight;if(!w||!h)return;const s=Math.min(w/1080,h/1920);if(s>0&&Math.abs(s-_lastScale)>0.0005){_lastScale=s;stage.style.transform=`translate(-50%,-50%) scale(${s})`;}}\nwindow.addEventListener('resize',fit);\nnew ResizeObserver(fit).observe($('viewport'));\nfit();\n\n/* ===================== TWEAKS ===================== */\nconst ACC={amber:{a:'#f59e0b',b:'#fbbf24',d:'#d97706'},ember:{a:'#fb6a3c',b:'#ff8a5c',d:'#d84a23'}};\nfunction applyAccent(v){const c=ACC[v],r=document.documentElement.style;r.setProperty('--amber',c.a);r.setProperty('--amber-br',c.b);r.setProperty('--amber-dp',c.d);}\nfunction applyFont(v){document.documentElement.style.setProperty('--f-hero',v==='archivo'?\"'Archivo',sans-serif\":\"'Big Shoulders Display',sans-serif\");}\nfunction applySpeed(v){speed=v==='slow'?0.85:v==='fast'?1.15:1;}\nfunction wire(id,fn){const g=$(id);g.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{g.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');fn(b.dataset.v);localStorage.setItem('cz_'+id,b.dataset.v);}));const s=localStorage.getItem('cz_'+id);if(s){const b=g.querySelector(`[data-v=\"${s}\"]`);if(b){g.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');fn(s);}}}\nwire('twAccent',applyAccent);wire('twFont',applyFont);wire('twSpeed',applySpeed);\n\nconst tweaksEl=$('tweaks');\nwindow.addEventListener('message',(e)=>{const ty=e&&e.data&&e.data.type;if(ty==='__activate_edit_mode')tweaksEl.classList.add('on');else if(ty==='__deactivate_edit_mode')tweaksEl.classList.remove('on');});\nwindow.parent.postMessage({type:'__edit_mode_available'},'*');\n$('twClose').addEventListener('click',()=>{tweaksEl.classList.remove('on');window.parent.postMessage({type:'__edit_mode_dismissed'},'*');});\nif(_q.get('tweaks')==='1')tweaksEl.classList.add('on');\nwindow.addEventListener('keydown',e=>{if(e.key==='t'||e.key==='T')tweaksEl.classList.toggle('on');});\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
